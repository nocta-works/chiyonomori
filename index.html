<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiyo no Mori — Shrines of Japan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A map of more than a hundred shrines, with Tokyo covered in depth.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ══════════════════════════════════════════════════════════════
     神社マップ_preview/index.html
     位置づけ：design-lab/opening-intro.html のスナップショット。
     本番index.html（幹）ともマスタープラン本セットアップ（枝1／
     神社マップ_intl）とも別物の、一時的な確認用プレビュー。
     ══════════════════════════════════════════════════════════════ */
  :root {
    --bg-body: #1a1209;
    --bg-header-1: #2c1810;
    --gold: #f5d08a;
    --gold-2: #e0b060;
    --gold-glow-rgb: 245,180,60;
    --gold-muted: #907040;
    --border-4: #6a5030;
    --tan-text: #ddd0a0;
    --tan-text-2: #b08858;
    /* ── 以下、本番index.htmlのポップアップ配色をそのまま流用（⑤本体の神宮・大社地図用） ── */
    --bg-popup-1: #1e0e06;
    --bg-popup-1-rgb: 30,14,6;
    --bg-popup-2: #0f0a1a;
    --border-header: #6b3a1f;
    --text-body: #f0e6c8;
    --color-link: #7eb8ff;
    --color-link-hover: #aad4ff;
    --color-wiki: #b8b8c8;
    --color-wiki-hover: #d8d8e8;
    --color-popup-reason: #708870;
    --color-popup-deity: #906848;
    /* 依頼X-2（2026-09-13）：幹（index.html）と同じ6個のモーショントークンを
       移植。海外版はこれまで秒数を直書きしていたため、一括調整ができなかった */
    --dur-fast: 0.12s;
    --dur-base: 0.15s;
    --dur-slow: 0.2s;
    --dur-slower: 0.25s;
    --dur-slowest: 0.28s;
    --dur-bar: 0.4s;
    --tag-jingu: #d4860a;    --tag-jingu-rgb: 212,134,10;   --tag-jingu-light: #f5c842;
    --tag-taisha: #7c3aed;   --tag-taisha-rgb: 124,58,237;  --tag-taisha-light: #c4a8ff;
    --tag-ichi: #e83020;     --tag-ichi-rgb: 232,48,32;     --tag-ichi-light: #ff9a8a;
    --tag-ni: #1a50d8;       --tag-ni-rgb: 26,80,216;       --tag-ni-light: #88b4ff;
    --tag-meisha: #059669;   --tag-meisha-rgb: 5,150,105;   --tag-meisha-light: #6ee7b7;
    --tag-meisha2: #0284c7;  --tag-meisha2-rgb: 2,132,199;  --tag-meisha2-light: #7dd3fc;
    --tag-meisha3: #b45309;  --tag-meisha3-rgb: 180,83,9;   --tag-meisha3-light: #fcd34d;
    --tag-hachiman: #be185d; --tag-hachiman-rgb: 190,24,93; --tag-hachiman-light: #f9a8d4;
    --tag-inari: #0d9488;    --tag-inari-rgb: 13,148,136;   --tag-inari-light: #5eead4;
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y proximity; }
  body {
    margin: 0; background: var(--bg-body); color: var(--tan-text);
    font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
  }

  /* ── ①②③（自動送り版と同一）：ロード画面→鳥居の静止画→全画面動画 ── */
  #intro {
    position: fixed; inset: 0; z-index: 5000;
    background: var(--bg-body);
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #intro.intro-hide { opacity: 0; pointer-events: none; }

  .intro-loader {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity 0.5s ease;
  }
  .intro-loader.intro-loader-hide { opacity: 0; }

  .intro-ring { position: relative; width: 88px; height: 88px; display: grid; place-items: center; }
  .intro-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .intro-ring circle { fill: none; stroke-width: 2; }
  .intro-ring-track { stroke: var(--border-4); opacity: 0.4; }
  .intro-ring-progress {
    stroke: var(--gold); stroke-dasharray: 251; stroke-dashoffset: 251;
    filter: drop-shadow(0 0 4px rgba(var(--gold-glow-rgb),0.7));
    animation: introRingFill 1.4s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .intro-torii { font-size: 34px; filter: drop-shadow(0 0 8px rgba(220,80,30,0.75)); }
  @keyframes introRingFill { to { stroke-dashoffset: 0; } }

  .intro-percent {
    font-variant-numeric: tabular-nums;
    color: var(--border-4); font-size: 11px; letter-spacing: 0.1em;
  }

  .intro-title {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: 18px; letter-spacing: 0.08em;
    opacity: 0; animation: introFadeIn 0.6s ease 0.3s forwards;
  }
  @keyframes introFadeIn { to { opacity: 1; } }


  /* ③動画（本人指定・2026-09-11：④の写真3枚と同じくスクロール対象の
     .scroll-slideとして表示。ズームアウト演出（scale 1.18→1）も写真と揃える） */
  .intro-video-media {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: var(--bg-header-1);
    transform: scale(1.18);
    transition: transform 5.5s cubic-bezier(0.16,0.6,0.3,1);
  }
  .scroll-slide.revealed .intro-video-media { transform: scale(1); }
  .intro-video-label {
    position: absolute; left: 14px; bottom: 14px; z-index: 1;
    font-size: 10px; letter-spacing: 0.06em; color: rgba(221,208,160,0.55);
    background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 3px;
  }

  .intro-overlay {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.35));
  }
  .intro-tagline {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); white-space: nowrap;
    z-index: 1;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--tan-text); font-size: 15px; letter-spacing: 0.06em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  /* ③動画だけのキャッチコピー（本人指定・2026-09-06：コラージュ見出し用の一文をここへ移動） */
  .intro-video-caption {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    z-index: 1; text-align: center; max-width: 82vw;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(20px, 3.2vw, 32px); letter-spacing: 0.05em;
    line-height: 1.6;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  /* ②③共通：文字を1文字ずつ順番にゆっくり表示する演出（本人指定・2026-09-08）。
     「絶対に見せる」演出ではなく、自然に読み進めるうちに次（④3枚の写真）へ
     気持ちが向くようにするための間（ま）。JSがテキストを1文字ずつ<span>に
     分割し、transition-delayをずらして設定する（wrapCharsReveal関数）。 */
  .intro-tagline .char, .intro-video-caption .char {
    display: inline-block; opacity: 0; transform: translateY(8px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .intro-tagline.intro-tagline-show .char,
  .intro-video-caption.intro-video-caption-show .char {
    opacity: 1; transform: translateY(0);
  }

  .intro-gate {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2;
    background: var(--bg-body);
    transition: transform 1.65s cubic-bezier(0.65,0,0.35,1);
  }
  .intro-gate-left { left: 0; }
  .intro-gate-right { right: 0; }
  .intro-gate::before {
    content: ''; position: absolute; top: 20%; width: 30px; height: 4px;
    background: var(--gold); box-shadow: 0 0 8px rgba(var(--gold-glow-rgb),0.6);
  }
  .intro-gate-left::before { right: -2px; }
  .intro-gate-right::before { left: -2px; }
  .intro-gate-left.intro-gate-open { transform: translateX(-100%); }
  .intro-gate-right.intro-gate-open { transform: translateX(100%); }

  @media (prefers-reduced-motion: reduce) {
    #intro { display: none !important; }
  }

  /* ── ④3枚の全画面写真をscroll-snapで縦に並べる（本人採用決定・2026-09-07）。
     scale(1.18)→scale(1)のズームアウトを、IntersectionObserverで
     画面に入った瞬間にトリガーする ── */
  .scroll-slide {
    position: relative; height: 100vh; overflow: hidden;
    scroll-snap-align: start;
  }
  .scroll-slide img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(0.92) contrast(1.05);
    transform: scale(1.18);
    transition: transform 5.5s cubic-bezier(0.16,0.6,0.3,1);
  }
  .scroll-slide.revealed img { transform: scale(1); }

  /* ④3枚の写真をまたいで「動かず・変わらない」1本の文字情報（本人指定・2026-09-06）。
     position:fixedでビューポートに固定し、スクロールしても位置も内容も一切変わらない。
     写真セクションを抜けて本体（mock-app）に入ったら消える ── */
  .fixed-caption {
    position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%);
    z-index: 10; text-align: center; max-width: 80vw; pointer-events: none;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(24px, 4vw, 38px); letter-spacing: 0.06em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.75);
    opacity: 0; transition: opacity 1s ease;
  }
  .fixed-caption.fixed-caption-show { opacity: 1; }

  /* 依頼AE-2④（2026-09-19確定）：写真区画を抜けた直後に置く「一過性の宣言」。
     他のscroll-slideと同じreveal-slide機構でフェードインする。
     本人指定（2026-09-20）：マップとオープニングを別ページに分離したため、
     このスライドがオープニング側の最後の画面になる。地図へはスクロール
     継続ではなく、このボタンのクリックで別ページ（map.html）へ遷移する */
  #declaration-slide {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    background: var(--bg-body);
  }
  .declaration-text {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(24px, 4.4vw, 44px); letter-spacing: 0.06em;
    text-align: center; padding: 0 24px;
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  #declaration-slide.revealed .declaration-text { opacity: 1; transform: translateY(0); }
  .enter-map-prompt {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 14px 30px; border-radius: 32px;
    background: transparent; border: 1px solid rgba(var(--gold-glow-rgb),0.5);
    color: var(--gold); font-size: 15px; font-weight: 700; letter-spacing: 0.15em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.1s ease 0.4s, transform 1.1s ease 0.4s, background 0.2s ease, border-color 0.2s ease;
  }
  #declaration-slide.revealed .enter-map-prompt { opacity: 1; transform: translateY(0); }
  .enter-map-prompt:hover { background: rgba(var(--gold-glow-rgb),0.14); border-color: var(--gold); }
  .enter-map-prompt-arrow { font-size: 18px; transition: transform 0.2s ease; }
  .enter-map-prompt:hover .enter-map-prompt-arrow { transform: translateX(4px); }
  @media (prefers-reduced-motion: reduce) {
    .declaration-text, .enter-map-prompt { transition: none; }
  }

  .scroll-slide-hint {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 26px; border-radius: 32px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(var(--gold-glow-rgb),0.45);
    font-size: 14px; font-weight: 700; letter-spacing: 0.35em; color: var(--gold);
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    animation: scrollHintPulse 1.6s ease-in-out infinite;
  }
  .scroll-slide-hint-arrow {
    font-size: 32px; line-height: 1; animation: scrollHintBounce 1.4s ease-in-out infinite;
  }
  @keyframes scrollHintBounce {
    0%, 100% { transform: translateY(0); opacity: 0.65; }
    50% { transform: translateY(14px); opacity: 1; }
  }
  @keyframes scrollHintPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(var(--gold-glow-rgb),0.2); }
    50% { box-shadow: 0 0 34px rgba(var(--gold-glow-rgb),0.5); }
  }
  /* 本人指定（2026-09-20）：動画が自動再生されない環境（reduced-motion指定・
     一部端末の節電モード等）のための、クリックを促す表示。JSが必要な時だけ
     .showを付ける（既定は非表示） */
  .video-play-prompt {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 6; display: none; align-items: center; gap: 10px;
    padding: 14px 28px; border-radius: 32px; cursor: pointer;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(var(--gold-glow-rgb),0.5);
    color: var(--gold); font-size: 15px; font-weight: 700; letter-spacing: 0.1em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    animation: scrollHintPulse 1.6s ease-in-out infinite;
  }
  .video-play-prompt.show { display: flex; }
  .video-play-prompt-icon { font-size: 18px; }
  /* ── トリプティック（実装キュー実行順7・2026-09-13戦略セッション確定仕様）：
     ④を縦写真1枚ずつのスクロールから、縦写真3枚を等幅3列で同時に見せる形へ
     置き換える。`_選定.json`のtriptychs配列が空（モードB未実行）の間は、
     現行の1枚ずつ3連スクロール（.scroll-slide／zoomout-manifest.json）に
     フォールバックする——このCSS・JSは既存のものをそのまま残してあり、
     以下は新しく追加するトリプティック用の別クラス。
     ⚠️選別ツールのモードB（photo-review.html）もこのCSSをそのまま使う想定
     （本人指定：「実際のオープニングと同じ並べ方で見せる」）。クラス名を
     変えるときは両方を必ず揃えて直すこと。 ── */
  .triptych-section {
    position: relative; height: 100vh; overflow: hidden;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: #000; scroll-snap-align: start;
  }
  .triptych-col { position: relative; overflow: hidden; height: 100%; }
  .triptych-col img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(0.92) contrast(1.05);
    opacity: 0; transition: opacity 1.2s ease;
  }
  .triptych-col.revealed img { opacity: 1; }
  /* 左→中→右の順に時間差でフェードイン（本人指定：ズームではなくフェード。
     3枚同時のtransformアニメーションは09-11のマーカー描画バグと同じ火種になる
     ため使わない） */
  .triptych-col[data-pos="0"] img { transition-delay: 0ms; }
  .triptych-col[data-pos="1"] img { transition-delay: 200ms; }
  .triptych-col[data-pos="2"] img { transition-delay: 400ms; }
  /* ④の固定キャプションは3枚をまたぐ.fixed-captionを使っていたが、
     トリプティックは1画面に収まるので「またぐ」必要が無い。三連の中に
     通常配置する（本人指定） */
  .triptych-caption {
    position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%);
    z-index: 10; text-align: center; max-width: 80vw; pointer-events: none;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(20px, 3.6vw, 34px); letter-spacing: 0.06em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.75);
    opacity: 0; transition: opacity 1s ease 300ms;
  }
  .triptych-caption.triptych-caption-show { opacity: 1; }
  /* 依頼AH-2（2026-09-20）：静止画にどの神社か分かるよう社名を出す。画像には
     焼き込まず、HTMLオーバーレイのdata-enで言語切替に乗せる。位置＝真ん中より
     やや上（本人指摘・2026-09-20：左下は目立たず読み飛ばされるため中央寄りへ
     変更）。⚠️本人指定（2026-09-20）＝トリプティック（3列同時表示）には使わず、
     フォールバック（1枚ずつのスクロール、公開プレビューで実際に使われる経路）
     専用。3枚のうち一部しか社名を引けず不揃いになるため、トリプティック側の
     ラベル付与は撤去した。
     ⚠️`left:50%+transform`で中央寄せしていた旧実装は、幅autoの絶対配置要素の
     shrink-to-fit計算が「containing block幅 − left」に縮んでしまい、日本語
     テキストが1文字ずつ縦積みで折り返すバグを引いた（狭い列幅の.triptych-col
     で発覚）。`left:0; right:0`で幅を確定させ、text-alignで中央寄せする形に
     修正。背景の黒帯も外し、他のキャプション（.fixed-caption等）と同じ
     縁取り文字（text-shadow）の流儀に揃えた */
  .photo-shrine-name {
    position: absolute; left: 0; right: 0; top: 40%; transform: translateY(-50%);
    z-index: 5; text-align: center; padding: 0 10px; pointer-events: none;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    font-size: clamp(20px, 3.2vw, 30px); letter-spacing: 0.1em; color: var(--gold);
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  @media (max-width: 480px) {
    .triptych-caption { font-size: clamp(15px, 4.4vw, 22px); bottom: 12%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .triptych-col img { transition: none; transition-delay: 0ms; }
    .triptych-caption { transition: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-slide-hint { animation: none; }
    .scroll-slide-hint-arrow { animation: none; }
  }

  /* ── ここから下は「本体（地図・メニュー画面）」。地図本体は本番index.htmlの実装を流用 ── */
  /* サイドバー実装時に発覚：min-height:100vhのままだと配下の#map-areaがflex:1でも
     「残りの縦幅を使う」動作にならず、サイドバーのリスト項目（152件の実コンテンツ）
     がそのまま縦に伸び、地図・サイドバー全体が4700px超まで引き伸ばされてしまう。
     heightを確定値にして初めてflex:1とoverflow-y:autoが機能する */
  .mock-app { height: 100vh; display: flex; flex-direction: column; scroll-snap-align: start; }
  .mock-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border-4);
    display: flex; align-items: center; gap: 10px;
  }
  .mock-header .torii-icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(220,80,30,0.75)); }
  .mock-header h1 {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    font-size: 18px; color: var(--gold); margin: 0; letter-spacing: 0.04em;
  }
  /* 言語切替（本人指摘・2026-09-08：漢字1文字のタグは海外版では意味をなさない。
     タグ・神社名の表現を英語に切り替えて見比べられるようにする試作） */
  .lang-toggle { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .lang-btn {
    font-size: 11px; letter-spacing: 0.05em; padding: 5px 10px; border-radius: 14px;
    border: 1px solid var(--border-4); background: transparent; color: var(--tan-text);
    cursor: pointer; font-family: inherit;
  }
  .lang-btn.active { background: rgba(var(--gold-glow-rgb),0.22); border-color: var(--gold); color: var(--gold); }
  /* 個別神社ページへの導線とタグフィルターを1段にまとめる（本人指定・2026-09-10：
     タグは右端に並べる。個別神社紹介は横並びのアイコン列ではなく、縦の収納型
     ――普段は閉じていてクリックで縦リストが開くドロップダウン――にする。
     「理想の形はあるが伝えにくいので、一般的なものを一旦採用」とのことなので、
     最も一般的なドロップダウンメニューの型を採用した */
  .mock-toolbar {
    display: flex; align-items: center; justify-content: flex-start; gap: 12px;
    padding: 10px 20px; border-bottom: 1px solid var(--border-4);
    position: relative;
  }
  .shrine-dropdown { position: relative; flex-shrink: 0; }
  .shrine-dropdown-toggle {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border-4);
    background: rgba(0,0,0,0.22); color: var(--tan-text);
    font-family: inherit; font-size: 13px; letter-spacing: 0.03em; cursor: pointer;
    transition: all var(--dur-slow);
  }
  .shrine-dropdown-toggle:hover { border-color: var(--gold-muted); color: var(--gold-2); }
  .shrine-dropdown.open .shrine-dropdown-toggle { border-color: var(--gold); color: var(--gold); background: rgba(var(--gold-glow-rgb),0.14); }
  .shrine-dropdown-caret { font-size: 9px; opacity: 0.7; transition: transform var(--dur-slow); }
  .shrine-dropdown.open .shrine-dropdown-caret { transform: rotate(180deg); }
  .shrine-dropdown-panel {
    /* z-indexはLeafletの内部ペイン（ズームコントロール1000・ポップアップペイン700等）より
       確実に上に来る値にする。#map-area・#shrine-mapのどちらもposition:relativeのみで
       z-indexを持たず独自の重なりコンテキストを作らないため、Leafletの内部要素の
       z-indexがそのままこのドロップダウンパネルと直接競合し、低い値だと地図の下に
       埋もれてしまう（本人指摘・2026-09-10で発覚） */
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 2000;
    min-width: 230px; max-height: 70vh; overflow-y: auto; padding: 6px;
    background: linear-gradient(180deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border: 1px solid var(--border-header); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: none;
  }
  .shrine-dropdown.open .shrine-dropdown-panel { display: block; }
  .shrine-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; text-decoration: none; }
  .shrine-dropdown-item:hover { background: rgba(var(--gold-glow-rgb),0.10); }
  .shrine-dropdown-badge {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 13px; font-weight: bold; color: #fff;
  }
  .shrine-dropdown-name { font-size: 13px; color: var(--tan-text); white-space: nowrap; }

  /* タグフィルター（本人指定・2026-09-10：海外版は神宮・大社・一宮・二宮の4タグに厳選。
     見た目・構成は本番index.htmlの.controls-tagsに合わせるが、参拝記録・令制国絞り込み・
     達成状況モーダルはこの地図には持ち込まない） */
  /* 本人指摘（2026-09-13）：「エリア」アイコンの配置が真ん中寄りに見えていた
     真因＝.mock-toolbarのjustify-content:space-betweenが3つの直接の子（基礎知識・
     エリア・タグ操作列）の間を均等な余白で押し広げていたため、2番目の「エリア」が
     隣の「基礎知識」から離れて浮いて見えていた（開いた時のパネルが左に寄りすぎた
     のも同じ原因＝ボタン自体が右へ押し出されていた分をパネル側の右寄せで
     打ち消していたための副作用）。.mock-toolbar側をflex-start＋ここでmargin-left:autoに
     変更し、2つのドロップダウンは隣接させたまま、タグ操作列だけを右端へ寄せる形にした */
  .mock-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
  .filter-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px; border: 1.5px solid;
    cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: 0.05em;
    transition: all var(--dur-slower); opacity: 0.42; background: transparent;
  }
  .filter-btn.active { opacity: 1; }
  .filter-btn.jingu  { border-color: var(--tag-jingu);  color: var(--tag-jingu-light);  background: rgba(var(--tag-jingu-rgb),0.12); }
  .filter-btn.jingu.active  { background: rgba(var(--tag-jingu-rgb),0.38);  box-shadow: 0 0 9px rgba(var(--tag-jingu-rgb),0.4); }
  .filter-btn.taisha { border-color: var(--tag-taisha); color: var(--tag-taisha-light); background: rgba(var(--tag-taisha-rgb),0.12); }
  .filter-btn.taisha.active { background: rgba(var(--tag-taisha-rgb),0.32); box-shadow: 0 0 9px rgba(var(--tag-taisha-rgb),0.4); }
  .filter-btn.ichi   { border-color: var(--tag-ichi);   color: var(--tag-ichi-light);   background: rgba(var(--tag-ichi-rgb),0.12); }
  .filter-btn.ichi.active   { background: rgba(var(--tag-ichi-rgb),0.36);   box-shadow: 0 0 9px rgba(var(--tag-ichi-rgb),0.4); }
  .filter-btn.ni     { border-color: var(--tag-ni);     color: var(--tag-ni-light);     background: rgba(var(--tag-ni-rgb),0.12); }
  .filter-btn.ni.active     { background: rgba(var(--tag-ni-rgb),0.32);     box-shadow: 0 0 9px rgba(var(--tag-ni-rgb),0.4); }
  .filter-btn.meisha { border-color: var(--tag-meisha); color: var(--tag-meisha-light); background: rgba(var(--tag-meisha-rgb),0.12); }
  .filter-btn.meisha.active { background: rgba(var(--tag-meisha-rgb),0.32); box-shadow: 0 0 9px rgba(var(--tag-meisha-rgb),0.4); }
  .filter-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  /* 格式の?ボタン（実装キュー依頼N-1・2026-09-13）：タグ列全体に1つだけ。
     押すと個別記事へは飛ばず、5タグを比較できる窓（モーダル）を開く
     （本人指定：格式は「比べないと意味が分からない」もの） */
  .rank-help-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; margin-left: 2px;
    font-family: inherit; font-size: 12px; line-height: 1; color: var(--tan-text); opacity: 0.6;
    border: 1px solid var(--border-4); background: rgba(255,255,255,0.03); cursor: pointer;
    transition: opacity var(--dur-slow), background var(--dur-slow); flex-shrink: 0;
  }
  .rank-help-btn:hover { opacity: 1; background: rgba(var(--gold-glow-rgb),0.14); }

  .rank-modal {
    position: fixed; inset: 0; z-index: 3000; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(8,6,3,0.72);
  }
  .rank-modal.open { display: flex; }
  .rank-modal-content {
    width: 100%; max-width: 480px; max-height: 84vh; overflow-y: auto;
    background: linear-gradient(180deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border: 1px solid var(--border-header); border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6); padding: 22px 22px 18px; position: relative;
  }
  .rank-modal-title { font-size: 15px; color: var(--gold); letter-spacing: 0.03em; margin: 0 30px 16px 0; }
  .rank-modal-close {
    position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--border-4); background: none; color: var(--tan-text); font-size: 15px; cursor: pointer;
  }
  .rank-modal-close:hover { background: rgba(255,255,255,0.08); }
  .rank-modal-row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); }
  .rank-modal-row:first-child { border-top: none; }
  .rank-modal-badge {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 15px; font-weight: bold; color: #fff;
  }
  .rank-modal-text { flex: 1; min-width: 0; }
  .rank-modal-row-title { font-size: 13px; color: var(--tan-text); display: flex; align-items: baseline; gap: 8px; }
  .rank-modal-count { font-size: 11px; color: var(--gold-muted); }
  .rank-modal-row p { margin: 4px 0 0; font-size: 12px; line-height: 1.8; color: var(--tan-text-2); }
  .rank-modal-more {
    display: block; text-align: center; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--border-4); font-size: 12px; color: var(--gold); text-decoration: none;
  }
  .rank-modal-more:hover { text-decoration: underline; }
  .ctrl-divider { width: 1px; height: 22px; background: var(--border-4); margin: 0 2px; flex-shrink: 0; }
  .mock-stats { font-size: 12px; color: var(--tan-text-2); border-left: 1px solid var(--border-4); padding-left: 10px; white-space: nowrap; }

  #map-area { flex: 1; display: flex; position: relative; overflow: hidden; min-height: 320px; }
  #shrine-map { flex: 1; min-width: 0; width: 100%; }
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border-left: 1px solid var(--border-header);
    display: flex; flex-direction: column;
  }
  .sidebar-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--border-header);
    background: rgba(44,24,16,0.6); flex-shrink: 0;
  }
  .sidebar-title { font-size: 12px; letter-spacing: 0.08em; color: var(--tan-text); }
  .sidebar-count { font-size: 11px; color: var(--gold-muted); }
  #sidebar-list {
    flex: 1; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border-header) transparent;
  }
  .sidebar-section-title {
    position: sticky; top: 0; z-index: 10;
    padding: 6px 12px 6px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-section-count { font-size: 10.5px; font-weight: 400; opacity: 0.65; }
  .shrine-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    cursor: pointer; border-bottom: 1px solid rgba(58,30,8,0.4);
    transition: background var(--dur-fast);
  }
  .shrine-item:hover { background: rgba(var(--gold-glow-rgb),0.08); }
  .shrine-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .shrine-item-name {
    font-size: 11.5px; color: var(--tan-text); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shrine-item-pref { font-size: 10px; color: var(--gold-muted); flex-shrink: 0; }

  /* 🔴依頼X-1（2026-09-13・最優先）：幹（index.html）は2026-09-09〜11に
     「マーカーが消える」「発光が明るすぎる」の2件を受けて3段階の修正を重ね、
     最終的にtransform:scaleを廃止してopacity単独に変更（コミットe7276a2）した。
     理由＝Leafletがマーカーの位置決めに同じtransformを使っており、CSSの
     scaleアニメーションと衝突する。海外版はこの修正が未反映で、同じバグを
     踏める状態のまま残っていた。幹と同じ形（opacityのみ）に揃える。
     「拡大しながら出現」の効果は失うが、フェードのみでも段階的出現は成立する
     （幹で実証済み）。durationも幹と同じ--dur-slower/--dur-fastに揃えた */
  @keyframes markerPopIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .marker-pop-in { animation: markerPopIn var(--dur-slower) ease-out both; }
  .marker-pop-out { animation: markerPopIn var(--dur-fast) ease-in reverse both; }

  /* 依頼X-3（2026-09-13）：幹だけが持っていた「サイドバーの追従」演出を移植。
     マーカーは速く反応する主役、サイドバーのリスト項目はやや遅れて横から
     スライドして追従する脇役、という速度差で「今どちらが主役か」を示す
     （枝2プランのparallax as hierarchy）。0.6s＝--dur-bar(0.4s)の1.5倍。
     transformを使うが、Leafletのマーカーとは無関係な通常のDOM要素なので
     X-1の問題（transformの衝突）は起きない */
  @keyframes listItemIn {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .shrine-item.list-item-in { animation: listItemIn 0.6s ease-out both; }

  /* 実行順F（依頼P-2＋R-4・2026-09-13）：エリア選択時の地図上の囲い表現。
     上のマーカーアニメーションの教訓（transformでのアニメーションはLeafletの
     位置決めと衝突する）を踏まえ、囲い自体（L.rectangle/L.circle）はLeafletが
     SVGのd属性で描画するため対象外だが、周辺のUI（マーカーの減光・CTAピル）も
     念のためopacityのみでアニメーションする */
  .leaflet-marker-icon { transition: opacity var(--dur-slowest) ease; }
  .marker-dimmed { opacity: 0.22 !important; }
  .area-enclosure-cta-wrap {
    /* 本人指摘（2026-09-20）：中央だとサイドバーも含めた全幅の真ん中になり
       ゴチャつくため、左寄せにする */
    position: absolute; top: 14px; left: 0; right: 0; z-index: 900;
    display: flex; justify-content: flex-start; padding-left: 16px; pointer-events: none;
  }
  .area-enclosure-cta {
    /* 本人指摘（2026-09-20）：浮かび上がる東京ページアイコンを前より大きく */
    display: none; align-items: center; gap: 10px; pointer-events: auto;
    padding: 13px 24px; border-radius: 28px; border: 1px solid var(--gold);
    background: rgba(20,14,6,0.92); color: var(--gold); font-size: 17px;
    letter-spacing: 0.03em; text-decoration: none; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5); opacity: 0; transition: opacity var(--dur-slower) ease;
  }
  .area-enclosure-cta.visible { display: flex; opacity: 1; }
  .area-enclosure-cta:hover { background: rgba(var(--gold-glow-rgb),0.22); }
  .area-enclosure-cta-close { opacity: 0.6; font-size: 18px; line-height: 1; padding-left: 2px; }
  .area-enclosure-cta-close:hover { opacity: 1; }
  /* 依頼Z-2①（2026-09-14）：エリアのLv表示を、カーソル追従のtooltipから
     枠の内側左上に常時表示する固定ラベルへ変更。理由＝マーカーホバーの社名表示
     （下の#hover-cursor-tag）とカーソル追従の表示先が競合するため、Lv表示は
     カーソルから退避させる（本人指定）。L.marker+divIconで作るため、
     Leafletのdivicon既定スタイル（白背景・枠線）を上書きする必要がある */
  /* pointer-events:none＝Leafletのinteractive:falseはクリック判定こそ外すが
     ネイティブのmouseoverイベントまでは止めないため、CSS側でも明示的に無効化する。
     これが無いと、ラベルにカーソルを乗せた時に.leaflet-marker-icon一致で
     マーカー社名のホバー表示（下の#hover-cursor-tag）と誤って競合する */
  .leaflet-div-icon.area-level-label-icon { background: transparent; border: none; pointer-events: none; }
  .area-level-label {
    display: inline-block; white-space: nowrap;
    background: rgba(20,14,6,0.92); border: 1px solid var(--gold); color: var(--gold);
    font-family: inherit; font-size: 11px; letter-spacing: 0.03em; padding: 3px 9px;
    border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }

  /* 依頼Z-2②（2026-09-14）：本番index.htmlの`initHoverCursorTag()`（枝2-B3）を
     移植。マーカーにカーソルを乗せると社名を、サイドバー項目に乗せると
     「地図へ」をカーソルのすぐ横に出す。CSSは本番と同一（色だけこのファイルの
     トークンに合わせている） */
  #hover-cursor-tag {
    position: fixed;
    z-index: 3000;
    pointer-events: none;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(var(--bg-popup-1-rgb),0.92);
    border: 1px solid var(--border-header);
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    opacity: 0;
    transform: translate(14px, 18px) scale(0.9);
    transition: opacity var(--dur-fast), transform var(--dur-fast);
  }
  #hover-cursor-tag.visible { opacity: 1; transform: translate(14px, 18px) scale(1); }

  /* 狭幅では引き出し式サイドバー等は作り込まず、まず地図の表示領域を優先する
     （本番のボトムシート化まではこの試作の現段階ではスコープ外） */
  @media (max-width: 640px) {
    #sidebar { display: none; }
  }
  /* タイルのみ暗色反転（マーカー・ポップアップには影響しない。本番index.htmlと同一処理） */
  .leaflet-tile-pane {
    filter: invert(0.91) hue-rotate(180deg) contrast(0.80) brightness(0.88) saturate(0.60);
  }
  .shrine-popup .leaflet-popup-content-wrapper {
    background: linear-gradient(135deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border: 1px solid var(--border-header); border-radius: 8px; color: var(--text-body);
    box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 15px rgba(200,80,20,0.12);
  }
  .shrine-popup .leaflet-popup-tip { background: var(--border-header); }
  .shrine-popup .leaflet-popup-close-button { color: var(--gold-muted) !important; }
  .popup-content { min-width: 190px; }
  .popup-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .popup-badge { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; letter-spacing:0.06em; border:1px solid; }
  .popup-badge.jingu    { background:rgba(var(--tag-jingu-rgb),0.22);    border-color:var(--tag-jingu);    color:var(--tag-jingu-light); }
  .popup-badge.taisha   { background:rgba(var(--tag-taisha-rgb),0.22);   border-color:var(--tag-taisha);   color:var(--tag-taisha-light); }
  .popup-badge.ichi     { background:rgba(var(--tag-ichi-rgb),0.22);     border-color:var(--tag-ichi);     color:var(--tag-ichi-light); }
  .popup-badge.ni       { background:rgba(var(--tag-ni-rgb),0.22);       border-color:var(--tag-ni);       color:var(--tag-ni-light); }
  .popup-badge.meisha   { background:rgba(var(--tag-meisha-rgb),0.22);   border-color:var(--tag-meisha);   color:var(--tag-meisha-light); }
  .popup-badge.meisha2  { background:rgba(var(--tag-meisha2-rgb),0.22);  border-color:var(--tag-meisha2);  color:var(--tag-meisha2-light); }
  .popup-badge.meisha3  { background:rgba(var(--tag-meisha3-rgb),0.22);  border-color:var(--tag-meisha3);  color:var(--tag-meisha3-light); }
  .popup-badge.hachiman { background:rgba(var(--tag-hachiman-rgb),0.22); border-color:var(--tag-hachiman); color:var(--tag-hachiman-light); }
  .popup-badge.inari    { background:rgba(var(--tag-inari-rgb),0.22);    border-color:var(--tag-inari);    color:var(--tag-inari-light); }
  .popup-name { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size:16px; font-weight:bold; color:var(--gold); margin-bottom:3px; text-shadow:0 0 8px rgba(var(--gold-glow-rgb),0.3); }
  .popup-pref { font-size:11px; color:var(--gold-muted); margin-bottom:7px; }
  .popup-province { font-size:11px; color:var(--tan-text-2); padding:3px 8px; background:rgba(255,255,255,0.05); border-radius:4px; margin-bottom:5px; }
  .popup-reason { font-size:11px; color:var(--color-popup-reason); padding:3px 8px; background:rgba(0,255,128,0.04); border-radius:4px; margin-bottom:5px; }
  .popup-deity { font-size:11px; color:var(--color-popup-deity); line-height:1.6; margin-bottom:8px; }
  /* サイト内への導線（実装キュー依頼N-2・2026-09-13）：外部3本（地図・公式・Wiki）
     より上に置く。外部リンクを置く画面には必ずサイト内への導線を上に置く、
     という今後の規則の最初の適用箇所 */
  .popup-link-detail {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 8px; border-radius: 6px; font-size: 11.5px; text-decoration: none;
    letter-spacing: 0.03em; margin-bottom: 6px;
    background: rgba(var(--gold-glow-rgb),0.16); border: 1px solid rgba(var(--gold-glow-rgb),0.4); color: var(--gold);
  }
  .popup-link-detail:hover { background: rgba(var(--gold-glow-rgb),0.3); }
  .popup-links { display: flex; gap: 5px; margin-top: 6px; }
  .popup-link { display: flex; align-items: center; justify-content: center; gap: 4px; flex: 1; min-width: 0; padding: 5px 6px; border-radius: 6px; font-size: 10.5px; text-decoration: none; letter-spacing: 0.03em; white-space: nowrap; }
  .popup-link-icon { font-size: 12px; }
  .popup-link.gmaps { background: rgba(66,133,244,0.14); border: 1px solid rgba(66,133,244,0.35); color: var(--color-link); }
  .popup-link.gmaps:hover { background: rgba(66,133,244,0.28); color: var(--color-link-hover); }
  .popup-link.official { background: rgba(var(--tag-jingu-rgb),0.14); border: 1px solid rgba(var(--tag-jingu-rgb),0.35); color: var(--gold-2); }
  .popup-link.official:hover { background: rgba(var(--tag-jingu-rgb),0.28); color: var(--gold); }
  .popup-link.wiki { background: rgba(150,150,165,0.14); border: 1px solid rgba(150,150,165,0.35); color: var(--color-wiki); }
  .popup-link.wiki:hover { background: rgba(150,150,165,0.28); color: var(--color-wiki-hover); }
  .mock-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
</style>
</head>
<body>

<div id="intro">
  <div class="intro-overlay"></div>
  <div class="intro-tagline" data-en="A country with 80,000 shrines. More than a hundred of them here.">八万の社がある国から、百余社。</div>
  <div class="intro-gate intro-gate-left"></div>
  <div class="intro-gate intro-gate-right"></div>
  <div class="intro-loader">
    <div class="intro-ring">
      <svg viewBox="0 0 90 90">
        <circle class="intro-ring-track" cx="45" cy="45" r="40"></circle>
        <circle class="intro-ring-progress" cx="45" cy="45" r="40"></circle>
      </svg>
      <div class="intro-torii">⛩</div>
    </div>
    <div class="intro-title">Chiyo no Mori</div>
    <div class="intro-percent" id="intro-percent">0</div>
  </div>
</div>

<!-- ③動画（本人指定・2026-09-11：タイマーで自動送りせず、④の写真3枚と同じ
     スクロール対象にする。#introを抜けた直後、最初にスクロールで辿り着く枠） -->
<section class="scroll-slide reveal-slide" id="video-slide">
  <video class="intro-video-media" autoplay muted loop playsinline>
    <source src="assets/samukawa-sample.mp4" type="video/mp4">
  </video>
  <button type="button" class="video-play-prompt" id="video-play-prompt">
    <span class="video-play-prompt-icon">▶</span>
    <span data-en="Tap to play">タップして再生</span>
  </button>
  <div class="intro-video-caption" id="intro-video-caption"><span class="ivc-line" data-en="Jingu, Taisha, Ichinomiya, Ninomiya.">神宮、大社、一宮、二宮。</span><br><span class="ivc-line" data-en="A ranking set a thousand years ago, still visible on a map.">千年前に決められた序列が、いまも地図の上に残っている。</span></div>
  <div class="scroll-slide-hint"><span class="scroll-slide-hint-arrow">⌄</span>SCROLL</div>
</section>

<div class="fixed-caption" id="fixed-caption" data-en="One step off the street, and the sound changes.">通りから一歩で、音が変わる。</div>

<div id="scroll-slides"></div>

<!-- 依頼AE-2④（2026-09-19確定）：一過性の宣言。写真区画を抜けた直後、
     地図（mock-app）へ入る直前に置く。この直後にAA-1の初期ズーム
     （日本全体→関東）が起きる想定で、文言と演出を揃えてある -->
<section class="scroll-slide reveal-slide" id="declaration-slide">
  <div class="declaration-text" data-en="From Japan, down to one city.">日本から、ひとつの街へ。</div>
  <button type="button" class="enter-map-prompt" id="enter-map-prompt">
    <span data-en="Enter the map">地図へ進む</span>
    <span class="enter-map-prompt-arrow">→</span>
  </button>
</section>

<script>
(function(){
  // ②③のキャッチコピー・神社名を1文字ずつ<span>に分割し、transition-delayを
  // ずらして「順番にゆっくり表示される」演出にする（本人指定・2026-09-08）。
  // fetchのコールバックは reduced/alreadyShown の早期returnと無関係に実行される
  // ため、CHAR_STEPはここで最初に定義しておく。
  function wrapCharsReveal(el, stepMs, startIndex) {
    var i = startIndex || 0;
    el.innerHTML = el.innerHTML.split('<br>').map(function(line){
      return Array.from(line).map(function(ch){
        var span = '<span class="char" style="transition-delay:' + (i * stepMs) + 'ms">' + ch + '</span>';
        i++;
        return span;
      }).join('');
    }).join('<br>');
    return i;
  }
  var CHAR_STEP = 120;   // 1文字あたりの表示間隔(ms)（本人指摘「速すぎる」で60→120に倍増）
  var CHAR_FADE = 1100;  // 1文字のフェード時間(ms)。CSSの.char transitionと合わせる（同じく倍増）
  var READ_BUFFER = 2500; // 全文字が表示され終わってから、読む余裕として追加する時間(ms)

  var intro = document.getElementById('intro');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alreadyShown = sessionStorage.getItem('introShown') === '1';
  if (reduced || alreadyShown) { intro.style.display = 'none'; return; }
  sessionStorage.setItem('introShown', '1');

  var loader = intro.querySelector('.intro-loader');
  var tagline = intro.querySelector('.intro-tagline');
  var videoCaption = document.getElementById('intro-video-caption');
  var gateLeft = intro.querySelector('.intro-gate-left');
  var gateRight = intro.querySelector('.intro-gate-right');
  var percentEl = document.getElementById('intro-percent');
  var finished = false;

  // 本人指定（2026-09-19）：一番始めのローディング（①ロード画面）だけを2倍長く。
  // ②動画キャプションの文字送り速度（CHAR_STEP）は共有定数なので触らない
  // （触ると③以降の速度も一緒に変わってしまう）——①専用のステップ・バッファを別に持つ
  var INTRO_SPEED = 2;
  var INTRO_CHAR_STEP = CHAR_STEP * INTRO_SPEED;
  var taglineCharCount = wrapCharsReveal(tagline, INTRO_CHAR_STEP);
  // ③動画のキャプションは後段でスクロール到達時に表示（下部の別IIFE参照）。
  // ⚠️2行がそれぞれ独自のdata-en（依頼AE-5）を持つ.ivc-line spanのため、
  // 親divのinnerHTMLをまとめてwrapCharsRevealに渡すとdata-en属性ごと
  // 文字ばらしされてしまう。行ごとに個別へ渡し、stepの連番だけ引き継ぐ
  (function(){
    var idx = 0;
    videoCaption.querySelectorAll('.ivc-line').forEach(function(line){
      idx = wrapCharsReveal(line, CHAR_STEP, idx);
    });
  })();
  var taglineHoldMs = Math.max(5000 * INTRO_SPEED, (taglineCharCount - 1) * INTRO_CHAR_STEP + CHAR_FADE + READ_BUFFER * INTRO_SPEED);

  var RING_MS = 1400 * INTRO_SPEED;
  var start = performance.now();
  function tickPercent(now) {
    var p = Math.min(100, Math.round((now - start) / RING_MS * 100));
    percentEl.textContent = p;
    if (p < 100 && !finished) requestAnimationFrame(tickPercent);
  }
  requestAnimationFrame(tickPercent);

  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add('intro-hide');
    setTimeout(function(){ intro.style.display = 'none'; }, 650);
  }
  function openGates() {
    loader.classList.add('intro-loader-hide');
    gateLeft.classList.add('intro-gate-open');
    gateRight.classList.add('intro-gate-open');
    tagline.classList.add('intro-tagline-show');
  }
  intro.addEventListener('click', finish);
  setTimeout(openGates, 1500 * INTRO_SPEED);   // ①ロード完了→gateが開く（2026-09-19：2倍長くした）
  // ②→③：本人指定・2026-09-11：③動画をタイマーの自動送りから外し、④の写真3枚と
  // 同じスクロール対象にした。そのため②の文字が読み終わったら即#introを閉じ、
  // 後は本人が実際にスクロールして③動画→④写真3枚と辿る方式にしている
  setTimeout(finish, 1500 * INTRO_SPEED + taglineHoldMs);
})();

// 依頼AG-3（2026-09-19）：自動再生ループ動画はprefers-reduced-motion指定時、
// 再生せず1フレーム目の静止画として止める（海外版の他6箇所と同じ流儀）。
// 2026-09-20追加（本人指定）：reduced-motion時、または一部端末（節電モード等）
// で自動再生そのものがブロックされた時のために、クリックで再生を促す表示を出す
(function(){
  var video = document.querySelector('.intro-video-media');
  var prompt = document.getElementById('video-play-prompt');
  if (!video) return;
  function showPrompt(){ if (prompt) prompt.classList.add('show'); }
  function hidePrompt(){ if (prompt) prompt.classList.remove('show'); }
  if (prompt) {
    prompt.addEventListener('click', function(){
      video.setAttribute('loop', '');
      var p = video.play();
      if (p && p.then) { p.then(hidePrompt).catch(function(){}); } else { hidePrompt(); }
    });
    video.addEventListener('playing', hidePrompt);
  }
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    video.removeAttribute('autoplay');
    video.removeAttribute('loop');
    video.pause();
    video.currentTime = 0;
    showPrompt();
    return;
  }
  // 通常時：自動再生が実際に始まったか少し待って確認し、始まっていなければ
  // （一部端末で自動再生がブロックされた場合）クリック促進表示を出す
  setTimeout(function(){ if (video.paused) showPrompt(); }, 1200);
})();

// ③動画のキャプションは、動画のスクロール枠が画面に入ったタイミングで表示する
// （本人指定・2026-09-11：タイマー表示をやめ、④の写真と同じスクロール駆動に統一）
(function(){
  var videoSlide = document.getElementById('video-slide');
  var videoCaption = document.getElementById('intro-video-caption');
  if (!videoSlide || !videoCaption) return;
  if (!('IntersectionObserver' in window)) {
    videoCaption.classList.add('intro-video-caption-show');
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        videoCaption.classList.add('intro-video-caption-show');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });
  io.observe(videoSlide);
})();

// ④の固定キャプションは、写真スクロール領域（#scroll-slides）が画面に入っている
// 間だけ表示する（本人指定・2026-09-11：③動画をスクロール対象化したのに伴い、
// 表示開始のトリガーを「#introが閉じた瞬間」から「実際に写真の枠までスクロール
// してきた瞬間」に変更。以前は#introを閉じた直後に表示していたため、③動画を
// スクロール中の間もキャプションが出てしまい、動画自体のキャプションと
// 位置が重なる問題があった）
(function(){
  var fixedCaption = document.getElementById('fixed-caption');
  var photoArea = document.getElementById('scroll-slides');
  if (!fixedCaption || !photoArea) return;
  if (!('IntersectionObserver' in window)) { fixedCaption.classList.add('fixed-caption-show'); return; }
  var io2 = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      fixedCaption.classList.toggle('fixed-caption-show', entry.isIntersecting);
    });
  }, { threshold: 0.2 });
  io2.observe(photoArea);
})();

// 本人指定（2026-09-20）：マップとオープニングを別ページに分離。地図へは
// このボタンのクリックで実際のページ遷移をする（スクロール継続ではない）。
// URLに?shrine=や?tags=が付いていた場合はそのままmap.htmlへ引き継ぐ
(function(){
  var btn = document.getElementById('enter-map-prompt');
  if (!btn) return;
  btn.addEventListener('click', function(){
    location.href = 'map.html' + location.search;
  });
})();

// ④スクロール連動のズームアウト：画面に入った写真だけ.revealedを付与
// （本人指定・2026-09-10：候補写真が増えたため、固定3枚ではなくマニフェストから
// 毎回ランダムに3枚選んで表示する。スライドをJSで動的に生成するため、
// このIntersectionObserver設定は挿入後に呼べるよう関数化してある）
function initScrollSlideReveal() {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.reveal-slide');
  if (reduced || !('IntersectionObserver' in window)) {
    items.forEach(function(el){ el.classList.add('revealed'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });
  items.forEach(function(el){ io.observe(el); });
}

// トリプティック（実装キュー実行順7・2026-09-13戦略セッション確定仕様）：
// ④を縦写真1枚ずつのスクロールから、縦写真3枚を等幅3列で同時に見せる形へ
// 置き換える。写真動画/_選定.json の triptychs 配列（本人がモードBで承認した
// 組み合わせ）から1組をランダムに選んで表示する。配列が空、またはこの
// ファイル自体が無い（=公開プレビュー環境。写真動画/は本番未同期）場合は、
// 従来どおりzoomout-manifest.jsonを使った1枚ずつ3連スクロールにフォールバック
// する——本人指定「空のときは現行のフォールバックにすること。ここを実装
// しないと、本人がモードBを回すまでオープニングが壊れる」。
(function(){
  var FALLBACK = [
    { file: 'assets/katori-backlit.jpg', alt: '香取神宮' },
    { file: 'assets/kashima-hall.jpg', alt: '鹿島神宮' },
    { file: 'assets/samukawa-sakura.jpg', alt: '寒川神社' },
  ];
  var SLIDE_COUNT = 3;
  // 依頼AH-2：フォールバック経路の写真は`alt`に社名が入っているものだけ社名を
  // 出せる（zoomout-manifest.jsonの大半はalt空欄＝どの社か特定できない写真の
  // ため、その場合はラベルを出さない＝本人指定の「無難」な扱い）
  var FALLBACK_NAME_EN = { '香取神宮': 'Katori Jingu', '鹿島神宮': 'Kashima Jingu', '寒川神社': 'Samukawa Jinja' };

  function pickRandom(list, n) {
    var pool = list.slice();
    var picked = [];
    while (picked.length < n && pool.length) {
      var idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked;
  }

  function pickOne(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // このIIFEは地図本体のapplyLang()と別クロージャで、写真は非同期fetch完了後に
  // 挿入されるため、挿入前に既にEN選択済みだった場合そのまま日本語で残ってしまう。
  // localStorageの保存値を直接見て、挿入直後だけその場でdata-enへ差し替える
  function applyStoredLangTo(root) {
    var lang;
    try { lang = localStorage.getItem('siteLang'); } catch(err) { lang = null; }
    // 2026-09-20発見：ここで先にjaCacheを確定させておかないと、地図本体側の
    // applyLang()の汎用スイッチが「その時点のtextContent」を日本語原文だと
    // 誤ってキャッシュしてしまう（このIIFEが先にEN文字列へ差し替えた後だと、
    // EN文字列がjaCacheとして固定され、以後JAへ戻せなくなるバグがあった）
    root.querySelectorAll('[data-en]').forEach(function(el){
      if (el.dataset.jaCache === undefined) el.dataset.jaCache = el.textContent;
    });
    if (lang !== 'en') return;
    root.querySelectorAll('[data-en]').forEach(function(el){
      el.textContent = el.getAttribute('data-en');
    });
  }

  // フォールバック経路：呼び出し側（startFallback）で既に3枚・順序込みで
  // 確定済みのlistをそのまま描画する（本人指定・2026-09-20＝3枚目を必ず
  // トリプティック合成画像にするため、ここで改めてシャッフルしてはいけない）
  function renderSlides(list) {
    var container = document.getElementById('scroll-slides');
    if (!container) return;
    var picked = list;
    container.innerHTML = picked.map(function(item, i){
      var idAttr = i === picked.length - 1 ? ' id="last-scroll-slide"' : '';
      var nameEn = item.alt ? FALLBACK_NAME_EN[item.alt] : null;
      var nameHtml = (item.alt && nameEn)
        ? '<div class="photo-shrine-name" data-en="' + nameEn + '">' + item.alt + '</div>'
        : '';
      return '<section class="scroll-slide reveal-slide"' + idAttr + '>' +
        '<img src="' + item.file + '" alt="' + (item.alt || '') + '">' +
        nameHtml +
        '<div class="scroll-slide-hint"><span class="scroll-slide-hint-arrow">⌄</span>SCROLL</div>' +
        '</section>';
    }).join('');
    applyStoredLangTo(container);
    initScrollSlideReveal();
    var fixedCaption = document.getElementById('fixed-caption');
    if (fixedCaption) fixedCaption.style.display = '';
  }

  // トリプティック経路（新規）：写真動画/内の元画像を直接参照する
  // （design-lab/assets/への縮小コピーは作っていない＝ローカルのdesign-lab
  // 環境専用の演出で、公開プレビューでは写真動画/自体が同期されないため
  // 自動的にフォールバック経路になる）
  function renderTriptych(photos) {
    var container = document.getElementById('scroll-slides');
    if (!container) return;
    // 公開プレビューでは動かさない機能なので、フォールバックの.fixed-caption
    // が同じ#scroll-slidesの交差判定で表示されてしまわないよう明示的に隠す
    var fixedCaption = document.getElementById('fixed-caption');
    if (fixedCaption) fixedCaption.style.display = 'none';
    container.innerHTML =
      '<section class="triptych-section reveal-triptych">' +
      photos.map(function(path, i){
        return '<div class="triptych-col" data-pos="' + i + '">' +
          '<img src="../' + path + '" alt="">' +
          '</div>';
      }).join('') +
      '<div class="triptych-caption" data-en="One step off the street, and the sound changes.">通りから一歩で、音が変わる。</div>' +
      '<div class="scroll-slide-hint"><span class="scroll-slide-hint-arrow">⌄</span>SCROLL</div>' +
      '</section>';
    // トリプティック経路はこの関数専用のIntersectionObserver（下記）しか回さないため、
    // 静的HTML側に置いた#declaration-slide（依頼AE-2④）が別途initScrollSlideReveal()
    // を呼ばないと永久にrevealされない。フォールバック経路（renderSlides）は既に
    // 呼んでいるので、ここでも同じ関数を呼んで両経路を揃える
    applyStoredLangTo(container);
    initScrollSlideReveal();
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var section = container.querySelector('.triptych-section');
    var cols = container.querySelectorAll('.triptych-col');
    var caption = container.querySelector('.triptych-caption');
    // 本人指定（2026-09-20）：トリプティック（3列同時表示）には社名ラベルを
    // 載せない。フォールバック（1枚ずつのスクロール）側だけに残す——依頼AH-2
    // 当初はここにも列ごとの社名ラベルを付けていたが、3枚のうち一部しか
    // ラベルを引けない（掲載社の外の写真が混ざる）ため見た目が不揃いになる
    function reveal(){
      cols.forEach(function(el){ el.classList.add('revealed'); });
      if (caption) caption.classList.add('triptych-caption-show');
    }
    if (reduced || !('IntersectionObserver' in window)) {
      reveal();
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) { reveal(); io.unobserve(entry.target); }
      });
    }, { threshold: 0.4 });
    io.observe(section);
  }

  function startFallback() {
    fetch('assets/zoomout-manifest.json')
      .then(function(res){ return res.json(); })
      .then(function(list){
        list = list || [];
        // 本人指定（2026-09-20）：静止画3枚目には必ずトリプティック（複数写真を
        // 1枚に合成した横長画像。ファイル名がtriptych-で始まる3件）を出す。
        // 単体版と混ざるとランダム抽選で出たり出なかったりしていたため固定する
        var triptychs = list.filter(function(item){ return /triptych-/.test(item.file); });
        // 1・2枚目＝本人指摘（2026-09-20・依頼AH-2の続き）：zoomout-manifest.json
        // の26枚中23枚はaltが空欄（社名を特定できない写真）で、そのままランダムに
        // 選ぶと社名ラベルが1枚も出ない確率の方が高かった。alt付きの候補だけに
        // 絞り込む（トリプティック合成画像は元々alt空欄＝ラベルは出ない）
        var labeled = list.filter(function(item){ return item.alt; });
        var firstTwo = labeled.length >= 2 ? pickRandom(labeled, 2) : labeled.slice();
        var third = triptychs.length ? pickOne(triptychs) : null;
        var slides = third ? firstTwo.concat([third]) : firstTwo;
        renderSlides(slides.length === SLIDE_COUNT ? slides : FALLBACK);
      })
      .catch(function(){ renderSlides(FALLBACK); });
  }

  // {cache:'no-store'}が要る：モードBで承認するたびに更新されるファイルなので、
  // ブラウザキャッシュが古いtriptychsを返し続ける事故を防ぐ（検証中に実際に発生した）
  fetch('../写真動画/_選定.json', { cache: 'no-store' })
    .then(function(res){ if (!res.ok) throw new Error('not found'); return res.json(); })
    .then(function(data){
      var triptychs = data && data.triptychs;
      if (triptychs && triptychs.length) {
        renderTriptych(pickOne(triptychs).photos);
      } else {
        startFallback();
      }
    })
    .catch(function(){ startFallback(); });
})();

</script>
</body>
</html>
